# Matching Android NDK C++ ABI; do not select platform or host libc++.
-nostdinc++
-isystem <CFGDIR>/sdk/usr/include/aarch64-linux-android/c++/v1
-isystem <CFGDIR>/sdk/usr/include/c++/v1
-nostdlib++
# Link-only options go after owner-supplied object inputs. The runtime is part of
# authenticated /usr, not the compiler APK or a writable global library directory.
$-Wl,-L,<CFGDIR>/../../lib64
$-lc++_shared
$-Wl,-rpath,/usr/lib64
