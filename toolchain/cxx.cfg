# Standalone C++ default: embed only the pinned Android NDK C++ runtime.
# Bionic, libm, libdl and /system/bin/linker64 remain Android's dynamic runtime.
# Multi-library C++ projects should use clang++-shared and one private shared STL.
-nostdinc++
-isystem <CFGDIR>/sdk/usr/include/aarch64-linux-android/c++/v1
-isystem <CFGDIR>/sdk/usr/include/c++/v1
-nostdlib++
# Link-only inputs follow the owner's objects. No files are copied into the project.
$-Wl,--start-group,<CFGDIR>/sdk/usr/lib/aarch64-linux-android/libc++_static.a,<CFGDIR>/sdk/usr/lib/aarch64-linux-android/libc++abi.a,--end-group
$-Wl,--exclude-libs,libc++_static.a:libc++abi.a:libunwind.a
