# Explicit shared C++ profile: one Android NDK STL per owner-controlled package.
# Supply libc++_shared.so beside the binary/DSO or in its lib/ subdirectory.
-nostdinc++
-isystem <CFGDIR>/sdk/usr/include/aarch64-linux-android/c++/v1
-isystem <CFGDIR>/sdk/usr/include/c++/v1
-nostdlib++
$-Wl,-L,<CFGDIR>/../../lib64
$-lc++_shared
# These are literal linker tokens, not environment-variable expansion.
$-Wl,-rpath,$ORIGIN:$ORIGIN/lib
